name: yanolja_clone
description: "A clone project of the Yanolja app for mobile platforms (Android & iOS)."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.2.6 <4.0.0'
  
# 지원 플랫폼: Android, iOS 
# Web, Linux, Windows, macOS는 지원하지 않음

dependencies:
  flutter:
    sdk: flutter
  
  # 상태관리
  flutter_riverpod: ^2.5.1
  
  # 라우팅 (화면 이동)
  go_router: ^15.2.4
  
  # 네트워크 이미지 캐싱
  cached_network_image: ^3.3.1

  # 애니메이션
  flutter_staggered_animations: ^1.1.1

  # 숫자, 날짜 포맷팅
  intl: ^0.20.2

  # 이미지 캐러셀
  carousel_slider: ^5.1.1

  # 그라데이션과 그림자 효과
  flutter_svg: ^2.0.9
  
  # 아이콘
  cupertino_icons: ^1.0.6
  
  # 선형 프로그레스바
  percent_indicator: ^4.2.3
  
  # 스무스 페이지 인디케이터
  smooth_page_indicator: ^1.1.0
  
  # 애니메이션 텍스트
  animated_text_kit: ^4.2.2
  
  # 시머 로딩 효과
  shimmer: ^3.0.0
  
  # 풀스크린 이미지 갤러리
  photo_view: ^0.14.0
  
  # 무한 스크롤 페이지네이션
  infinite_scroll_pagination: ^4.0.0
  
  # 격자 레이아웃 (Staggered Grid)
  flutter_staggered_grid_view: ^0.7.0
  
  firebase_core: ^3.14.0
  firebase_auth: ^5.6.0
  google_sign_in: ^7.0.0
  google_maps_flutter: ^2.12.3
  provider: ^6.1.5

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true